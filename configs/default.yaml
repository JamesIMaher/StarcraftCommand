env:
  map_name: Simple64
  opponent_race: zerg
  difficulty: very_easy
  map_size: 64
  step_mul: 8
  build_cooldown_steps: 3
  max_game_loop_norm: 20000
  visualize: false
  # One-time ASCII dump of the pathing grid / units / sector targets at the
  # first reset -- see EnvConfig.pathing_debug_path.
  pathing_debug_path: pathing_debug.txt
  # The grid is laid over the map's PLAYABLE area (read from the game at
  # reset), which on Simple64 is a ~43x43 square in the raw frame. 6x6 (36
  # sectors) gives ~7.1x7.1 cells, half-diagonal ~5 -- comfortably within a
  # marine's sight range (~9), so standing at a cell's center sees the whole
  # cell (the old 4x4 over the full 64x64 square had 16x16 cells with a
  # half-diagonal of ~11.3, beyond sight range -- confirmed live as the
  # cause of enemy buildings tucked in a cell corner going undetected).
  # Going finer trades search thoroughness for search speed: more sectors
  # means more visits to sweep the whole map within an episode.
  grid:
    cols: 6
    rows: 6
  masking:
    max_supply_depots: 8
    max_barracks: 4
    supply_depot_minerals: 100
    barracks_minerals: 150
    marine_minerals: 50
    min_marines_to_move: 4
    # Higher bar for moving to any sector other than home -- matches
    # scripted_policy.py's ScriptedPolicyConfig.attack_threshold. See the
    # comment on MaskConfig.min_marines_to_advance in config.py.
    min_marines_to_advance: 20
  reward:
    shaping_enabled: true
    shaping_coefficient: 0.001
    economic_value_cap: 4000.0
    concentration_threshold: 20
    kill_value_scale: 0.1
    kill_value_cap: 2000.0
    home_defense_penalty: 0.05
    # Episodes have no step limit, so this per-step penalty is capped per
    # episode -- see the comment on RewardConfig.home_defense_penalty_cap in
    # config.py (this is what fixed ep_rew_mean reaching -46.4 in a single
    # long, untrained early episode).
    home_defense_penalty_cap: 1.0
    scouting_bonus: 0.02
    # Counterweight to home_defense_penalty's unbounded per-step drag -- see
    # the comment on RewardConfig.exploration_bonus in config.py. Raised
    # from 0.02 after the policy settled into staying home with 20+ marines.
    exploration_bonus: 0.1
    # Further counterweight to the army stalling once assembled -- see the
    # comment on RewardConfig.stale_search_penalty in config.py.
    stale_search_penalty: 0.02
    stale_search_patience: 20
    stale_search_penalty_cap: 2.0
    # Time costs something: finishing sooner beats finishing later at all.
    time_penalty_per_step: 0.001
    time_penalty_cap: 2.0
    # Closing distance to a known enemy building pays continuously -- see
    # the comment on RewardConfig.approach_reward_scale in config.py.
    approach_reward_scale: 2.0
    approach_reward_cap: 3.0
    # Deliberately dominant -- see the comment on RewardConfig.terminal_reward_scale
    # in config.py: with the caps above, worst-case shaping per episode is
    # ~+11.5 / -12, so 20x (+-20) guarantees a win's total is always positive
    # and a loss's is always negative.
    terminal_reward_scale: 20.0

training:
  checkpoint_dir: checkpoints
  checkpoint_freq: 5000
  tensorboard_log: runs
  # See the comments on PPOConfig in config.py for why these differ from
  # SB3's defaults: episodes are thousands of steps long and the policy
  # starts from a behavior-cloned initialization worth preserving.
  ppo:
    total_timesteps: 200000
    learning_rate: 0.0001
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.995
    gae_lambda: 0.95
    clip_range: 0.2
    # The "randomization" knob: entropy bonus keeping the policy from
    # collapsing to deterministic choices. Watch train/entropy_loss.
    ent_coef: 0.02
    seed: null
