env:
  map_name: Simple64
  opponent_race: zerg
  difficulty: very_easy
  map_size: 64
  step_mul: 8
  build_cooldown_steps: 3
  max_game_loop_norm: 20000
  visualize: false
  # 6x6 (36 sectors): cell size ~10.7x10.7, half-diagonal ~7.5 -- comfortably
  # within a marine's sight range (~9), unlike the old 4x4's 16x16 cells
  # (half-diagonal ~11.3, beyond sight range -- confirmed live as the cause
  # of enemy buildings tucked in a cell corner going undetected). Going
  # finer than this trades search thoroughness for search speed: more
  # sectors means more visits needed to sweep the whole map within an
  # episode's step budget (see scripted_policy.py's search_timeout_steps).
  grid:
    cols: 6
    rows: 6
  masking:
    max_supply_depots: 8
    max_barracks: 4
    supply_depot_minerals: 100
    barracks_minerals: 150
    marine_minerals: 50
    min_marines_to_move: 4
  reward:
    shaping_enabled: true
    shaping_coefficient: 0.001
    economic_value_cap: 4000.0
    concentration_threshold: 4
    kill_value_scale: 0.1
    kill_value_cap: 2000.0
    home_defense_penalty: 0.05
    scouting_bonus: 0.02
    # Deliberately dominant -- see the comment on RewardConfig.terminal_reward_scale
    # in config.py: with the caps above, worst-case shaping per episode is
    # ~4.9, so 10x (+-10) guarantees any win outscores any loss.
    terminal_reward_scale: 10.0

training:
  checkpoint_dir: checkpoints
  checkpoint_freq: 5000
  tensorboard_log: runs
  ppo:
    total_timesteps: 200000
    learning_rate: 0.0003
    n_steps: 256
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    seed: null
